# Bridgekeeper configuration.
#
# Every setting below is optional: omitted keys fall back to built-in defaults,
# which are chosen to be safe rather than convenient. Any setting can also be
# overridden by an environment variable named BKD_<KEY>, which is the right
# place for secrets — see the systemd unit.
#
# Unknown keys are rejected at startup, so a typo fails loudly instead of
# silently reverting to a default.

server:
  # Loopback on purpose. TLS terminates in nginx or Caddy in front of this;
  # binding a public interface here would serve terminal traffic in cleartext.
  bind: "127.0.0.1:8443"

  # The URL users actually visit. Used for cookie scoping, SSO redirects and
  # generated links, so it must match reality.
  external_url: "https://bridgekeeper.example.com"

  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_grace: 30s

database:
  # "postgres" for a shared deployment, "sqlite" for a single user or a lab.
  driver: postgres

  # A local Unix socket avoids exposing the database on the network at all.
  dsn: "postgres:///bkd?host=/var/run/postgresql&sslmode=disable"

  # For SQLite instead:
  # driver: sqlite
  # dsn: "/var/lib/bkd/bkd.db"

  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h

  # Apply pending migrations at startup. Set false if your deployment runs
  # "bkd migrate" as an explicit step.
  auto_migrate: true

vault:
  # Protects shared team keys and credentials marked for unattended use. It
  # does NOT open an ordinary user's vault — that needs their passphrase.
  # Back this file up separately from the database.
  master_key_path: "/var/lib/bkd/master.key"

  # Argon2id cost for deriving a user's key from their vault passphrase.
  # These are the RFC 9106 second recommended option. Raising them
  # strengthens resistance to offline cracking of a stolen database, at the
  # cost of login latency and server memory (memory_kb per concurrent login).
  # Existing vaults keep the parameters they were created with, so raising
  # these is safe and applies to new and re-keyed vaults.
  argon2_time: 3
  argon2_memory_kb: 65536
  argon2_threads: 4

  # How long an idle unlocked vault stays unlocked. Activity refreshes it.
  unlock_ttl: 12h

auth:
  access_token_ttl: 15m
  refresh_token_ttl: 168h
  require_mfa: false
  max_login_attempts: 5
  lockout_window: 15m

paths:
  data_dir: "/var/lib/bkd"
  session_log_dir: "/var/lib/bkd/logs"
  recording_dir: "/var/lib/bkd/recordings"

log:
  level: info      # debug | info | warn | error
  format: json     # json for log shippers, text for humans

policy:
  # Off by default. When enabled, a user can export credentials as plaintext
  # after re-entering their vault passphrase and confirming; every such export
  # is recorded as a critical audit event. In a shared deployment this is the
  # most direct exfiltration path there is — leave it off unless you have a
  # specific reason. Encrypted bundle export stays available either way.
  allow_plaintext_export: false

  allow_password_auth: true

  # A changed host key is a hard failure, not a warning. Turning this off
  # exposes every connection to man-in-the-middle.
  require_host_key_verify: true

  record_all_sessions: false
