# Bridgekeeper configuration.
#
# Every setting below is optional: omitted keys fall back to built-in defaults,
# which are chosen to be safe rather than convenient. Any setting can also be
# overridden by an environment variable named BKD_<KEY>, which is the right
# place for secrets — see the systemd unit.
#
# Unknown keys are rejected at startup, so a typo fails loudly instead of
# silently reverting to a default.

server:
  # Loopback on purpose. TLS terminates in nginx or Caddy in front of this;
  # binding a public interface here would serve terminal traffic in cleartext.
  bind: "127.0.0.1:8443"

  # The URL users actually visit. Used for cookie scoping, SSO redirects and
  # generated links, so it must match reality.
  external_url: "https://bridgekeeper.example.com"

  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  shutdown_grace: 30s

  # Networks whose X-Forwarded-For header is believed, so audit records show
  # the user's address rather than the proxy's. List only the reverse proxy
  # in front of this server: anything listed here can forge a client IP, so
  # an empty list is safer than a generous one.
  trusted_proxy_cidrs:
    - "127.0.0.1/32"
    - "::1/128"

database:
  # "postgres" for a shared deployment, "sqlite" for a single user or a lab.
  driver: postgres

  # A local Unix socket avoids exposing the database on the network at all.
  dsn: "postgres:///bkd?host=/var/run/postgresql&sslmode=disable"

  # For SQLite instead:
  # driver: sqlite
  # dsn: "/var/lib/bkd/bkd.db"

  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 1h

  # Apply pending migrations at startup. Set false if your deployment runs
  # "bkd migrate" as an explicit step.
  auto_migrate: true

vault:
  # Protects shared team keys and credentials marked for unattended use. It
  # does NOT open an ordinary user's vault — that needs their passphrase.
  # Back this file up separately from the database.
  master_key_path: "/var/lib/bkd/master.key"

  # Argon2id cost for deriving a user's key from their vault passphrase.
  # These are the RFC 9106 second recommended option. Raising them
  # strengthens resistance to offline cracking of a stolen database, at the
  # cost of login latency and server memory (memory_kb per concurrent login).
  # Existing vaults keep the parameters they were created with, so raising
  # these is safe and applies to new and re-keyed vaults.
  argon2_time: 3
  argon2_memory_kb: 65536
  argon2_threads: 4

  # How long an idle unlocked vault stays unlocked. Activity refreshes it.
  unlock_ttl: 12h

  # THE security decision in this file. With single sign-on the server never
  # sees a password, so there is nothing to derive a vault key from.
  #
  #   passphrase      after the Microsoft redirect the user types a vault
  #                   passphrase once per working day. A stolen database and
  #                   master key together yield nothing.
  #   server_managed  single sign-on alone opens everything. Nothing extra to
  #                   type — and a stolen database plus master key yields
  #                   every credential in the system.
  #
  # server_managed is what most commercial web-SSH products do and is a
  # defensible trade, but it discards the property this system is built
  # around. Decide it deliberately; it is logged loudly at startup.
  sso_unlock_mode: passphrase

auth:
  # A session ends after this long without activity, and unconditionally after
  # session_absolute_ttl however active it has been. The absolute lifetime is
  # what bounds a stolen cookie: without it, an attacker who keeps a session
  # warm keeps it forever.
  session_idle_ttl: 12h
  session_absolute_ttl: 720h

  # off | optional | required. "optional" lets people enrol a second factor
  # without forcing it; require_mfa_for_admins tightens it for the accounts
  # that can change everyone else's.
  mfa_policy: optional
  require_mfa_for_admins: false

  # Sign-in throttling. The per-address limit must be at least the per-account
  # one, or a single user's retries would lock out everyone behind their
  # office NAT.
  max_attempts_per_account: 5
  max_attempts_per_address: 30
  lockout_window: 15m
  lockout_duration: 15m

  # Leave this on. Off, the session cookie is sent over plain HTTP, which is
  # only ever correct behind a TLS-terminating proxy on the same host.
  secure_cookies: true

  oidc:
    enabled: false
    # For Microsoft Entra, the tenant-specific v2.0 issuer:
    #   https://login.microsoftonline.com/<tenant-id>/v2.0
    issuer: ""
    client_id: ""
    # Leave empty here and set BKD_OIDC_CLIENT_SECRET instead. A secret in
    # this file is a secret in your configuration management system.
    client_secret: ""
    # Required when the issuer is a multi-tenant endpoint, and a good idea
    # regardless: without it any account in the world can sign in.
    allowed_tenants: []
    # Create an account on first successful sign-in. Set false to require
    # that accounts be provisioned ahead of time.
    auto_provision: true
    provider_name: "Microsoft"

paths:
  data_dir: "/var/lib/bkd"
  session_log_dir: "/var/lib/bkd/logs"
  recording_dir: "/var/lib/bkd/recordings"

log:
  level: info      # debug | info | warn | error
  format: json     # json for log shippers, text for humans

policy:
  # Off by default. When enabled, a user can export credentials as plaintext
  # after confirming; every such export is recorded as a critical audit event.
  # In a shared deployment this is the most direct exfiltration path there is —
  # leave it off unless you have a specific reason.
  #
  # This gates secrets, not formats. Exporting an ssh_config or a CSV of
  # hostnames without keys or passwords is unaffected, and the encrypted
  # bundle export stays available either way.
  allow_plaintext_export: false

  allow_password_auth: true

  # A changed host key is a hard failure, not a warning. Turning this off
  # exposes every connection to man-in-the-middle.
  require_host_key_verify: true

  record_all_sessions: false

  # Delete session transcripts older than this many days. Zero — the default —
  # keeps them forever, because a record nobody should silently lose is one you
  # keep until you choose a policy. Set it once you have decided how long a
  # transcript is worth keeping against what it holds.
  transcript_retention_days: 0

  # The two endpoints that accept a large body. Neither is a limit on what can
  # be transferred: the file browser splits a large upload into chunks and
  # resumes each at an offset, so max_upload_bytes bounds one request. A
  # request over either cap is refused outright rather than truncated.
  max_upload_bytes: 1073741824   # 1 GiB per upload request
  max_import_bytes: 67108864     # 64 MiB per imported configuration

  # Off by default, and the word that matters is "listening". Everything else
  # here reaches outward; this accepts inbound connections on a shared machine,
  # and whoever can reach the port gets whatever is behind it without
  # authenticating to bkd at all. Turn it on only alongside tunnels.bind below.
  #
  # It is what lets somebody point a database client, an RDP client or a
  # browser's SOCKS setting at a host only this server can see.
  allow_tcp_tunnels: false

  # Remote forwarding: `ssh -R`. The device listens, and a connection arriving
  # there is carried back and dialled *from this server*.
  #
  # Off by default for a different reason than the setting above. That one
  # lets whoever can reach this machine reach a device. This one lets whoever
  # can reach the *device* reach whatever this machine's network can — which,
  # on a server shared by a whole team, is a great deal more than the person
  # who opened the tunnel had in mind. bkd refuses loopback and link-local
  # destinations outright, so its own API, its database socket and any cloud
  # metadata service stay out of reach; the rest of the network does not.
  allow_remote_forwards: false

  # Telnet. On by default, and that is a decision rather than an oversight.
  #
  # Telnet is plaintext: the password crosses the network in the clear, and so
  # does everything typed after it. But the equipment that needs it cannot do
  # anything else — console servers, older switches, PDUs, anything whose
  # management plane predates its owner's security policy — and refusing it
  # does not make those devices go away. It makes people reach them with
  # something that has no audit log.
  #
  # The cost is made visible instead: the tab is marked, and every connection
  # is recorded with encrypted=false. Turn this off once the telnet estate is
  # retired, and find out immediately who had not noticed.
  allow_telnet: true

  # Serial ports on this machine. Off by default, and it should stay off
  # almost everywhere: it only does anything where this server is physically
  # cabled to the equipment, which for a central install is essentially never.
  # A lab box on somebody's bench is what it is for. For a rack reached over
  # the network, use a console server — those speak SSH or telnet.
  allow_serial: false

serial:
  # Which ports may be opened. The path comes from a saved connection, which
  # is to say from a user, so this list is what stands between that and an
  # arbitrary-file-read on a server holding everyone's encrypted credentials.
  # Refusing anything that is not a character device is not enough on its own:
  # /dev/mem is a character device.
  #
  # Empty opens nothing. Name the ports that exist and nothing else:
  #   allowed_devices:
  #     - "/dev/ttyUSB*"
  #     - "/dev/ttyS[0-3]"
  #
  # Matched after symbolic links are resolved, so a link cannot reach past it.
  allowed_devices: []

tunnels:
  # Where forwarded ports listen. Loopback makes the feature useless from
  # anywhere but this machine, which is the safe default; widening it is a
  # decision to make once, knowingly.
  bind: "127.0.0.1"

  # The ports tunnels are allocated from, so one firewall rule can cover them
  # and stay true. Privileged ports are refused: bkd runs unprivileged.
  # Below the kernel's ephemeral range, which on Linux is 32768-60999 unless
  # somebody changed it — check with:
  #     cat /proc/sys/net/ipv4/ip_local_port_range
  # A range inside that overlaps the ports the kernel hands out as outbound
  # source ports, so a listener will occasionally fail to bind against a
  # socket it cannot see. bkd retries, and warns at startup if the ranges
  # overlap, but the fix is to pick a range that does not.
  port_range: "30000-30999"

  # The wildcard base for reaching a device's own web interface — a switch or
  # router GUI — through a bastion, with no open port and nothing to configure
  # on the laptop. Each tunnel is served at <id>.<this domain>.
  #
  # Empty disables it, and that is a safe default rather than an oversight. A
  # device's pages cannot be served from bkd's own origin: the CSRF cookie is
  # readable by JavaScript by design, so a script on a compromised switch
  # would inherit the whole session and every credential behind it. A separate
  # origin is what makes this possible at all.
  #
  # To enable: point a wildcard DNS record (*.tunnels.example.com) at this
  # host and let Caddy issue certificates on demand. See docs/TUNNELS.md.
  domain: ""

  max_per_user: 8
  idle_timeout: 1h
